<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password | Father & Sons</title>
    <link rel="stylesheet" href="assets/fonts/google-fonts.css">
    <link rel="stylesheet" href="css/tailwind.min.css?v=20260919001">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-900">
    <main class="mx-auto w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl sm:p-8">
        <div class="mb-7 text-center">
            <a href="index.html" class="font-serif text-3xl italic text-amber-600">Father &amp; Sons</a>
            <h1 class="mt-5 text-xl font-black">Create a new password</h1>
            <p class="mt-2 text-sm leading-6 text-slate-500">Choose a strong password for your account.</p>
        </div>

        <div id="resetPasswordMessage" class="mb-4 hidden rounded-xl border px-4 py-3 text-sm" role="status" aria-live="polite"></div>

        <form id="resetPasswordForm" class="space-y-4">
            <div>
                <label for="resetPassword" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-slate-600">New password</label>
                <div class="relative">
                    <input id="resetPassword" type="password" autocomplete="new-password" required minlength="8" class="w-full rounded-lg border border-slate-300 py-3 pl-3 pr-12 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20" placeholder="Enter a new password">
                    <button type="button" class="password-visibility-toggle absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 transition hover:text-amber-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-amber-500" data-password-target="resetPassword" aria-label="Show new password" aria-pressed="false">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div>
                <label for="resetPasswordConfirm" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-slate-600">Confirm password</label>
                <div class="relative">
                    <input id="resetPasswordConfirm" type="password" autocomplete="new-password" required minlength="8" class="w-full rounded-lg border border-slate-300 py-3 pl-3 pr-12 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20" placeholder="Enter it again">
                    <button type="button" class="password-visibility-toggle absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 transition hover:text-amber-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-amber-500" data-password-target="resetPasswordConfirm" aria-label="Show confirmation password" aria-pressed="false">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <p class="text-xs leading-5 text-slate-500">Use at least 8 characters with uppercase and lowercase letters, a number, and one special character (!@#$%^&amp;*).</p>
            <button id="resetPasswordSubmit" type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-3 font-bold text-white transition hover:bg-slate-800 disabled:cursor-wait disabled:opacity-60">Reset Password</button>
        </form>

        <a href="index.html" class="mt-6 block text-center text-sm font-semibold text-amber-700 hover:underline">Back to sign in</a>
    </main>
    <script src="assets/vendor/js/axios.min.js?v=20260909001"></script>
    <script src="js/reset_password.js?v=20261009001"></script>
</body>
</html>
