    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .portal-nav { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); }
        html.dark .portal-nav { background: rgba(15,17,21,0.92); }

            gap: 0.5rem;

            font-size: 0.875rem !important;
        }
        textarea.guardian-additional-field {

            resize: vertical;
        }
        .guardian-register-popup {
            border-radius: 1.5rem !important;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(15, 23, 42, 0.22) !important;
        }
        .guardian-register-popup .swal2-html-container {
            margin: 0 !important;
            padding: 0 !important;
            overflow: visible !important;
        }
        .guardian-register-shell {
            padding: 1.5rem;
            background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
        }
        .guardian-register-hero {
            padding-bottom: 1rem;
        }
        .guardian-register-kicker {
            text-transform: uppercase;

        }
        .guardian-register-section + .guardian-register-section {
            margin-top: 0.9rem;
        }
        .guardian-register-section-head {

            padding: 0.55rem 0.8rem;
            min-width: 10rem;
            text-align: right;
        }
        .guardian-register-branch-label {
            display: block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;

            opacity: 0.7;
        }
        .guardian-register-branch-name {
            display: block;
            font-size: 0.92rem;
            font-weight: 700;
            margin-top: 0.1rem;
        }
        .guardian-register-label {
            display: block;
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #52525b;
            margin-bottom: 0.45rem;
        }
        .guardian-register-note {
            border: 1px dashed #d4af37;
            background: #fffaf0;
            border-radius: 0.9rem;
            padding: 0.9rem 1rem;
        }
        .guardian-register-helper {
            margin-top: 0.45rem;
            font-size: 0.72rem;
            color: #71717a;
        }
        .guardian-swal-input {
            width: 100% !important;
            margin: 0 !important;
            border-radius: 0.75rem !important;
            border: 1px solid #e4e4e7 !important;
            background: #fff !important;
            padding: 0.95rem 1rem !important;
            box-shadow: none !important;
            color: #111827 !important;
        }
        .guardian-swal-input:focus {
            border-color: #b8860b !important;
            box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.15) !important;
        }
        .guardian-swal-file {
            display: block;
            width: 100%;
            border: 1px solid #e4e4e7;
            border-radius: 0.75rem;
            background: #fff;
            padding: 0.72rem 0.9rem;
            color: #374151;
        }

<body class="portal-easy bg-gray-50 dark:bg-obsidian text-zinc-900 dark:text-white antialiased min-h-screen">

    <nav class="portal-nav fixed w-full z-50 border-b border-zinc-200 dark:border-white/10 px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center shadow-lg">
        <div class="flex min-w-0 items-center gap-3 sm:gap-6">
            <a href="../../index.html" class="h-10 flex items-center">
                <img src="../../assets/fas-logo.png" alt="Logo" class="h-full w-auto dark:brightness-200">
            </a>
        </div>
        <div class="flex items-center gap-2 sm:gap-4">
            <div class="hidden md:flex flex-col text-right">
                <span id="guardianNavName" class="text-sm font-semibold text-zinc-900 dark:text-white">Guardian</span>
            </div>
            <button id="guardianMobileMenuToggle" type="button" class="md:hidden grid h-10 w-10 place-items-center rounded-xl border border-zinc-200 dark:border-white/10 bg-white dark:bg-white/5 text-zinc-700 dark:text-zinc-200">
                <i class="fas fa-bars"></i>
            </button>
            <button onclick="logout()" class="hidden md:inline-flex px-4 py-2 rounded-xl bg-zinc-100 dark:bg-white/5 hover:bg-zinc-200 dark:hover:bg-white/10 border border-zinc-200 dark:border-white/10 text-sm font-semibold transition text-zinc-700 dark:text-zinc-200">
                <i class="fas fa-sign-out-alt mr-2 text-gold-500"></i>Logout
            </button>
        </div>
    </nav>

    <aside class="fixed inset-y-0 left-0 w-72 bg-white dark:bg-black/60 z-40 pt-24 hidden lg:flex flex-col border-r border-zinc-200 dark:border-white/5">
        <div class="px-6 space-y-8 flex-1 mt-4">
            <div class="portal-sidebar-card rounded-3xl border border-zinc-200 dark:border-white/10 bg-white dark:bg-white/5 shadow-lg dark:shadow-black/30">
                <div class="flex items-start gap-3"><div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-gold-500 to-gold-400 text-black grid place-items-center font-black text-xl shrink-0">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="portal-sidebar-meta flex-1 min-w-0">
                        <div id="guardianSidebarName" class="portal-sidebar-name text-base font-extrabold truncate text-zinc-900 dark:text-white">Guardian</div>
                        <div id="guardianSidebarEmail" class="portal-sidebar-email text-xs text-zinc-500 dark:text-zinc-400 truncate mt-0.5">—</div>
                        <div class="portal-profile-branch"><span class="portal-profile-branch-label">Branch</span><span id="guardianSidebarBranch" class="portal-profile-branch-value" data-portal-branch title="">—</span></div>
                    </div>
                </div>
                <div class="mt-3 h-1.5 rounded-full bg-gold-500"></div>
            </div>
            <div>
                <nav class="space-y-2">
                    <a href="guardian_dashboard.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-white/5 rounded-xl transition-all">
                        <i class="fas fa-gauge-high mr-3 text-zinc-500"></i> Dashboard
                    </a>
                    <a href="guardian_students.html" class="sidebar-item-active flex items-center px-4 py-3 text-sm font-extrabold rounded-xl shadow-lg transition-all">
                        <i class="fas fa-user-graduate mr-3"></i> Students
                    </a>
                    <a href="guardian_payments.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-white/5 rounded-xl transition-all">
                        <i class="fas fa-wallet mr-3 text-zinc-500"></i> Payments
                    </a>
                    <a href="guardian_absences.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-white/5 rounded-xl transition-all">
                        <i class="fas fa-notes-medical mr-3 text-zinc-500"></i> Absence Requests
                    </a>
                    <a href="guardian_profile.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-white/5 rounded-xl transition-all">
                        <i class="fas fa-user-pen mr-3 text-zinc-500"></i> Profile
                    </a>
                </nav>
            </div>
        </div>
    </aside>

    <div id="guardianMobileMenu" class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm md:hidden hidden">
        <div class="absolute inset-y-0 left-0 w-72 max-w-[85%] bg-white dark:bg-obsidian border-r border-zinc-200 dark:border-white/10 pt-20 pb-6 flex flex-col shadow-xl">
            <div class="px-6 space-y-6 flex-1 overflow-y-auto">
                <div class="portal-sidebar-card rounded-3xl border border-zinc-200 dark:border-white/10 bg-white dark:bg-white/5 shadow-lg dark:shadow-black/30">
                    <div class="flex items-start gap-3"><div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-gold-500 to-gold-400 text-black grid place-items-center font-black text-xl shrink-0">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="portal-sidebar-meta flex-1 min-w-0">
                            <div id="guardianMobileMenuProfileName" class="portal-sidebar-name text-base font-extrabold truncate text-zinc-900 dark:text-white">Guardian</div>
                            <div id="guardianMobileMenuProfileEmail" class="portal-sidebar-email text-xs text-zinc-500 dark:text-zinc-400 truncate mt-0.5">—</div>
                            <div class="portal-profile-branch"><span class="portal-profile-branch-label">Branch</span><span id="guardianMobileMenuProfileBranch" class="portal-profile-branch-value" data-portal-branch title="">—</span></div>
                        </div>
                    </div>
                    <div class="mt-3 h-1.5 rounded-full bg-gold-500"></div>
                </div>
                <div>
                    <nav class="space-y-2">
                        <a href="guardian_students.html" class="sidebar-item-active flex items-center px-4 py-3 text-sm font-extrabold rounded-xl shadow-lg transition-all">
                            <i class="fas fa-user-graduate mr-3"></i> Students
                        </a>
                        <a href="guardian_payments.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-600 dark:text-zinc-300 rounded-xl transition-all">
                            <i class="fas fa-wallet mr-3 text-zinc-500"></i> Payments
                        </a>
                        <a href="guardian_absences.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-600 dark:text-zinc-300 rounded-xl transition-all">
                            <i class="fas fa-notes-medical mr-3 text-zinc-500"></i> Absence Requests
                        </a>
                        <a href="guardian_profile.html" class="flex items-center px-4 py-3 text-sm font-semibold text-zinc-600 dark:text-zinc-300 rounded-xl transition-all">
                            <i class="fas fa-user-pen mr-3 text-zinc-500"></i> Profile
                        </a>
                    </nav>
                </div>
            </div>
            <div class="px-6 border-t border-zinc-200 dark:border-white/10 pt-4 flex items-center justify-between">
                <div class="text-xs text-zinc-500 dark:text-zinc-400" id="guardianMobileMenuName">Signed in</div>
                <button onclick="logout()" class="px-3 py-2 rounded-xl bg-zinc-100 dark:bg-white/5 hover:bg-zinc-200 dark:hover:bg-white/10 border border-zinc-200 dark:border-white/10 text-xs font-semibold transition text-zinc-700 dark:text-zinc-300">
                    <i class="fas fa-sign-out-alt mr-1 text-gold-400"></i>Logout
                </button>
            </div>
        </div>
    </div>

    <main class="lg:ml-72 pt-24 sm:pt-28 p-4 sm:p-8">
        <div class="max-w-7xl mx-auto">
            <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
                <h1 class="portal-page-title text-zinc-900 dark:text-white">Students</h1>
                <div class="flex flex-wrap gap-3 text-sm">
                    <div class="rounded-2xl border border-zinc-200 dark:border-white/10 bg-white dark:bg-white/5 px-4 py-2">
                        <span class="portal-stat-label">Students</span>
                        <span id="guardianStudentCount" class="ml-2 font-bold text-zinc-900 dark:text-white">0</span>
                    </div>
                    <div class="rounded-2xl border border-gold-200 dark:border-gold-500/20 bg-gold-50 dark:bg-gold-500/10 px-4 py-2">
                        <span class="portal-stat-label">Due</span>
                        <span id="guardianTotalBalance" class="ml-2 font-bold text-gold-600 dark:text-gold-400">₱0.00</span>
                    </div>
                    <div class="rounded-2xl border border-zinc-200 dark:border-white/10 bg-white dark:bg-white/5 px-4 py-2">
                        <span class="portal-stat-label">Paid</span>
                        <span id="guardianTotalPaid" class="ml-2 font-bold text-zinc-900 dark:text-white">₱0.00</span>
                    </div>
                </div>
            </div>

            <div class="mb-6 rounded-3xl border border-zinc-200 dark:border-white/10 bg-white dark:bg-white/5 p-4 sm:p-5 shadow-sm">
                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                    <div>
                        <div class="text-lg font-extrabold text-zinc-900 dark:text-white">Register a student</div>
                        <div class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Use the button below to register another student from your guardian account.</div>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <button type="button" onclick="guardianRegisterNewStudent()" class="px-4 py-3 rounded-2xl bg-gold-500 hover:bg-gold-400 text-black text-sm font-bold transition">
                            Register Another Student
                        </button>
                    </div>
                </div>
            </div>

            <div id="guardianStudentsList" class="grid grid-cols-1 gap-4"></div>
        </div>
    </main>

    <div id="guardianStudentModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="w-full max-w-2xl max-h-[82vh] overflow-y-auto rounded-2xl border border-zinc-200 dark:border-white/10 bg-white dark:bg-[#111318] shadow-2xl">
            <div class="sticky top-0 z-10 flex items-center justify-between gap-4 border-b border-zinc-200 dark:border-white/10 bg-white/95 dark:bg-[#111318]/95 backdrop-blur px-4 sm:px-5 py-3">
                <div>
                    <div id="guardianStudentModalTitle" class="text-lg sm:text-xl font-black text-zinc-900 dark:text-white">Student</div>
                </div>
                <button type="button" onclick="closeGuardianStudentModal()" class="grid h-10 w-10 place-items-center rounded-full border border-zinc-200 dark:border-white/10 bg-zinc-100 dark:bg-white/5 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-white/10 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="guardianStudentModalBody" class="p-4 sm:p-5"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/mode.js"></script>
    <button id="themeToggle" aria-label="Toggle dark or light mode"><div class="relative w-6 h-6 flex items-center justify-center"><i id="sunIcon" class="fas fa-sun absolute inset-0 m-auto transition-opacity duration-300"></i><i id="moonIcon" class="fas fa-moon absolute inset-0 m-auto transition-opacity duration-300 opacity-0"></i></div></button>
    <script src="../../js/portal_sidebar.js"></script>
    <script src="../../js/index.js"></script>
    <script src="../../js/session_timeout.js"></script>
</body>
